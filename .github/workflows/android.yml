name: Android
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore
        if: env.KEYSTORE_B64 != ''
        env: { KEYSTORE_B64: ${{ secrets.ELSEWHERE_KEYSTORE_B64 }} }
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/elsewhere.jks" && echo "ELSEWHERE_KEYSTORE=$RUNNER_TEMP/elsewhere.jks" >> "$GITHUB_ENV"
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_ARG=-Pelsewhere.version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - env: { ELSEWHERE_KEYSTORE_PASSWORD: ${{ secrets.ELSEWHERE_KEYSTORE_PASSWORD }} }
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug assembleDebug --no-daemon $VERSION_ARG
      - uses: actions/upload-artifact@v4
        with: { name: elsewhere-debug.apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "elsewhere-$GITHUB_REF_NAME.apk"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: elsewhere-*.apk
          generate_release_notes: true
